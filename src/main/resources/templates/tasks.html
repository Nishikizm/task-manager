<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <title>Task Manager</title>
    </head>
    <body>
        <h1>Task List</h1>
        <button class="openModal">Add Task</button>
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>Title</th>
                    <th>Deadline</th>
                    <th>Completed</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="task: ${tasks}">
                    <td><input type="checkbox"></td>
                    <td th:text="${task.title}">Sample</td>
                    <td th:text="${task.deadline}">Sample</td>
                    <td><input type="checkbox" th:checked="${task.completed}" th:disabled="${task.completed}"></td>
                    <td><a href="#">Edit</a><a href="#">Delete</a></td>
                </tr>
            </tbody>
        </table>
        <div id="modalOverlay">
            <div id="modalForm">
                <div class="closeModal">
                    <button type="button">×</button>
                </div>
                <form th:object="${taskForm}">
                    <div class="formParts">
                        <label th:for="*{title}">Title</label>
                        <input type="text" th:field="*{title}" placeholder="Title" required>
                    </div>
                    <div class="formParts">
                        <label th:for="*{description}">Description</label>
                        <textarea th:field="*{description}" placeholder="Description" rows="5"></textarea>
                    </div>
                    <div class="formParts">
                        <fieldset>
                            <legend>Deadline</legend>
                            <select th:field="*{year}">
                                <option value="2026">2026</option>
                            </select>
                            <select th:field="*{month}">
                                <option value="3">March</option>
                            </select>
                            <select th:field="*{day}">
                                <option value="9">9</option>
                            </select>
                            <select th:field="*{time}">
                                <option value="10:00">10:00</option>
                            </select>
                        </fieldset>
                    </div>
                    <div class="formParts">
                        <label th:for="*{completed}">Completed</label>
                        <input type="checkbox" th:field="*{completed}">
                    </div>
                    <div class="formParts formActions">
                        <button type="reset">Clear</button>
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </div>
        <script th:src="@{/webjars/jquery/4.0.0/jquery.min.js}"></script>
        <script th:src="@{/js/main.js}"></script>
    </body>
</html>

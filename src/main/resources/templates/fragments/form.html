<section th:fragment="inputForm" th:id="formFragment">
    <form th:object="${taskForm}" th:action="${url}" th:method="${method}" id="form">
        <div class="formParts">
            <label th:for="*{title}">Title</label>
                <input type="text" th:field="*{title}" placeholder="Title" required>
        </div>
        <div class="formParts">
            <label th:for="*{description}">Description</label>
            <textarea th:field="*{description}" placeholder="Description" rows="5"></textarea>
        </div>
        <div class="formParts">
            <fieldset>
                <legend>Deadline</legend>
                <select th:field="*{year}">
                    <option value="2026">2026</option>
                </select>
                <select th:field="*{month}">
                    <option value="3">March</option>
                </select>
                <select th:field="*{day}">
                    <option value="9">9</option>
                </select>
                <select th:field="*{time}">
                    <option value="10:00">10:00</option>
                </select>
            </fieldset>
        </div>
        <div class="formParts">
            <label th:for="*{completed}">Completed</label>
            <input type="checkbox" th:field="*{completed}">
        </div>
        <div class="formParts formActions">
            <button type="reset">Clear</button>
            <button type="submit" id="formBtn">Submit</button>
        </div>
    </form>
</section>
